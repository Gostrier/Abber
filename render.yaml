databases:
  - name: abber-postgres
    databaseName: abber
    user: abber
    plan: free
    region: oregon

services:
  - type: web
    name: abber-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_USERNAME
        fromDatabase:
          name: abber-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: abber-postgres
          property: password
      - key: DB_HOST
        fromDatabase:
          name: abber-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: abber-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: abber-postgres
          property: database
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@abber.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_FRONTEND_URL
        value: http://localhost:5173
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173
      - key: MAIL_USERNAME
        value: ""
      - key: MAIL_PASSWORD
        value: ""
