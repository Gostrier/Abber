spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:abber}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:

    open-in-view: false

    hibernate:
      ddl-auto: validate

  flyway:

    enabled: true

server:

  port: ${PORT:8080}