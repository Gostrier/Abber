spring:
  application:
    name: abber-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}


  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

server:
  port: 8080

logging:
  config: classpath:logback-spring.xml

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:3000}

  admin:
    email: ${ADMIN_EMAIL:admin@abber.local}
    password: ${ADMIN_PASSWORD:}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET:kUsRlDeoqwLyXnE6+RBjp6k5WRpOjsGVzJpHrO1fcNFG7ka6YfNXeeSiSD6dPBV9DtwsvF+nUbkyeE509FIqTw==}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000
